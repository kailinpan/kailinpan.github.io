<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Research by Kailin Pan.">
  <title>Research · Kailin Pan</title>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$', '$']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
  <style>
    :root { --ink: #222; --muted: #666; --line: #dedede; --link: #1558a6; --width: 920px; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #fff; font: 17px/1.7 Georgia, "Times New Roman", serif; }
    a { color: var(--link); text-decoration: none; }
    a:hover, a:focus { text-decoration: underline; }
    .site-header { border-bottom: 1px solid var(--line); }
    .nav { max-width: var(--width); margin: 0 auto; padding: 22px 24px 18px; display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
    .brand { color: var(--ink); font-size: 1.28rem; font-weight: 600; white-space: nowrap; }
    .nav-links { display: flex; flex-wrap: wrap; gap: 20px; }
    .nav-links a { color: #444; }
    .nav-links a[aria-current="page"] { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 5px; }
    main { max-width: var(--width); margin: 0 auto; padding: 58px 24px 72px; }
    h1, h2 { line-height: 1.25; font-weight: 500; }
    h1 { margin: 0 0 36px; font-size: 2.15rem; }
    h2 { margin: 0 0 18px; font-size: 1.35rem; }
    .entries { margin: 0; padding-left: 1.5rem; }
    .entries li { margin: 0 0 24px; padding-left: .3rem; }
    .title { font-weight: 600; }
    .meta { color: var(--muted); }
    mjx-container { color: inherit; }
    footer { margin-top: 54px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem; }
    @media (max-width: 640px) {
      .nav { align-items: flex-start; flex-direction: column; gap: 10px; }
      main { padding-top: 38px; }
      h1 { font-size: 1.85rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="nav" aria-label="Main navigation">
      <a class="brand" href="/">Kailin Pan</a>
      <div class="nav-links">
        <a href="/">About Me</a>
        <a href="/research/" aria-current="page">Research</a>
        <a href="/notes/">Notes</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Research</h1>

    <section aria-labelledby="preprints">
      <h2 id="preprints">Preprints</h2>
      <ol class="entries">
        <li>
          <span class="title">Constant spectral Mackey functors and the equivariant Steenrod algebra.</span>
          <a href="https://arxiv.org/abs/2610.05654">arXiv</a>.
        </li>
        <li>
          <span class="title">Normed equivariant ring spectra and the \(A_n\)-modules.</span>
          <span class="meta">Joint work in progress with
            <a href="https://zhenpeng-li.github.io/">Zhenpeng Li</a>.</span>
        </li>
      </ol>
    </section>

    <footer><a href="/">← Back to About Me</a></footer>
  </main>
</body>
</html>
